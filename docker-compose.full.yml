# Docker Compose da Stack Completa do ChatRAG (Infraestrutura + Aplicação)
#
# Para rodar toda a aplicação em contêineres:
#   docker compose -f docker-compose.full.yml up -d --build
#
# Na PRIMEIRA execução (ou após docker compose down -v) o serviço backend-api
# roda automaticamente, em ordem:
#   1. Migrações do banco (idempotente)
#   2. Criação do bucket MinIO (idempotente)
#   3. Criação do usuário Master (idempotente — ignora se já existe)
#
# Credenciais do Master são definidas nas variáveis abaixo (ou no .env):
#   MASTER_EMAIL    (default: admin@chatrag.local)
#   MASTER_PASSWORD (default: Admin@2025!)

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatrag}
      POSTGRES_DB: ${POSTGRES_DB:-chatrag}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - chatrag_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatrag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - chatrag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chatrag}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chatrag123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - chatrag_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API principal — roda o entrypoint.sh que executa setup na inicialização
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3333}:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://${POSTGRES_USER:-chatrag}:${POSTGRES_PASSWORD:-chatrag}@db:5432/${POSTGRES_DB:-chatrag}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chatrag}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-chatrag123}
      S3_BUCKET: ${S3_BUCKET:-chatrag-sources}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      APP_MASTER_KEY: ${APP_MASTER_KEY:-dev-master-key-32-chars-long-secret!}
      SESSION_COOKIE_NAME: chatrag_session
      SESSION_TTL_HOURS: 12
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Credenciais do usuário Master criado automaticamente na primeira inicialização
      MASTER_EMAIL: ${MASTER_EMAIL:-admin@chatrag.local}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-Admin@2025!}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Worker de indexação e expurgo — não precisa rodar o setup
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sobrescreve o entrypoint: worker não faz setup, só processa filas
    entrypoint: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-chatrag}:${POSTGRES_PASSWORD:-chatrag}@db:5432/${POSTGRES_DB:-chatrag}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chatrag}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-chatrag123}
      S3_BUCKET: ${S3_BUCKET:-chatrag-sources}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      APP_MASTER_KEY: ${APP_MASTER_KEY:-dev-master-key-32-chars-long-secret!}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  chatrag_postgres_data:
  chatrag_redis_data:
  chatrag_minio_data:
