# Docker Compose da Stack Completa do ChatRAG
#
# Sobe TUDO em contêiner — infra + backend + worker + painel web:
#   docker compose -f docker-compose.full.yml up -d --build
#
# Na primeira execução o backend-api roda automaticamente via entrypoint.sh:
#   1. Migrações do banco (idempotente)
#   2. Criação do bucket MinIO (idempotente)
#   3. Criação do usuário Master (idempotente)
#
# Customize copiando .env.example para .env e ajustando as variáveis.

services:
  # ---------------------------------------------------------------------------
  # Infraestrutura
  # ---------------------------------------------------------------------------

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatrag}
      POSTGRES_DB: ${POSTGRES_DB:-chatrag}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - chatrag_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatrag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - chatrag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chatrag}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chatrag123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - chatrag_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Backend API (roda migrações + setup no entrypoint antes de abrir a porta)
  # ---------------------------------------------------------------------------

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3333}:3333"
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://${POSTGRES_USER:-chatrag}:${POSTGRES_PASSWORD:-chatrag}@db:5432/${POSTGRES_DB:-chatrag}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chatrag}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-chatrag123}
      S3_BUCKET: ${S3_BUCKET:-chatrag-sources}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      APP_MASTER_KEY: ${APP_MASTER_KEY:-dev-master-key-32-chars-long-secret!}
      SESSION_COOKIE_NAME: chatrag_session
      SESSION_TTL_HOURS: 12
      # CORS libera o painel web (ajuste se usar domínio próprio)
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Credenciais do Master — criado automaticamente se ainda não existir
      MASTER_EMAIL: ${MASTER_EMAIL:-admin@chatrag.local}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-Admin@2025!}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Worker de indexação (não roda setup — apenas processa filas BullMQ)
  # ---------------------------------------------------------------------------

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-chatrag}:${POSTGRES_PASSWORD:-chatrag}@db:5432/${POSTGRES_DB:-chatrag}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chatrag}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-chatrag123}
      S3_BUCKET: ${S3_BUCKET:-chatrag-sources}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      APP_MASTER_KEY: ${APP_MASTER_KEY:-dev-master-key-32-chars-long-secret!}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Painel Web (frontend — TanStack Start + Nitro)
  # ---------------------------------------------------------------------------

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL pública da API — o navegador do usuário precisa alcançar este endereço
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3333}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend-api:
        condition: service_healthy

volumes:
  chatrag_postgres_data:
  chatrag_redis_data:
  chatrag_minio_data:
