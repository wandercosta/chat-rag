name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

# Gate de CI proporcional ao MVP (ADR-002 #9): isolamento e contrato bloqueiam
# merge; avaliacao RAG (quando existir) roda em cadencia mais espacada, fora deste workflow.
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chatrag
          POSTGRES_PASSWORD: chatrag
          POSTGRES_DB: chatrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chatrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chatrag:chatrag@localhost:5432/chatrag
      REDIS_URL: redis://localhost:6379
      APP_MASTER_KEY: ci-only-key-not-a-real-secret-32bytes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Module boundary check (ADR-002)
        run: npm run deps:check

      - name: Run migrations
        run: npm run migrate:up

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration
