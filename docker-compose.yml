# Ambiente de desenvolvimento local do ChatRAG.
#
# O que e Docker, em uma frase: cada "service" abaixo roda em um container,
# uma especie de mini-computador isolado com so o necessario para rodar aquele
# programa (banco, fila, storage), sem precisar instalar nada disso direto na
# sua maquina.
#
# Comandos basicos (rodar na pasta onde este arquivo esta):
#   docker compose up -d        -> sobe tudo em segundo plano
#   docker compose ps           -> mostra o que esta rodando
#   docker compose logs -f db   -> acompanha o log de um servico (ex.: db)
#   docker compose down         -> derruba tudo (mantem os dados salvos)
#   docker compose down -v      -> derruba tudo E APAGA os dados (cuidado)

services:
  # Banco de dados principal. Usa uma imagem que ja vem com a extensao
  # pgvector instalada (necessaria para busca por similaridade de embeddings).
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatrag}
      POSTGRES_DB: ${POSTGRES_DB:-chatrag}
    ports:
      # <porta na sua maquina>:<porta dentro do container>
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Guarda os dados do banco fora do container, para nao perder nada
      # quando o container for recriado.
      - chatrag_postgres_data:/var/lib/postgresql/data
      # Scripts aqui dentro rodam automaticamente na primeira vez que o
      # volume de dados e criado (ver infra/postgres-init/001-pgvector.sql).
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatrag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fila e cache. Usado depois pelo worker de indexacao e por rate limit.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - chatrag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Armazenamento de arquivos compativel com S3, para rodar local sem
  # depender de uma conta na AWS. O console web fica em uma porta separada.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chatrag}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chatrag123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"   # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # painel web do MinIO
    volumes:
      - chatrag_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

# Volumes nomeados = onde o Docker guarda os dados de verdade no seu disco,
# fora dos containers. Sem isso, "docker compose down" apagaria tudo.
volumes:
  chatrag_postgres_data:
  chatrag_redis_data:
  chatrag_minio_data:
